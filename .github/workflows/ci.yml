name: CI & OSS Privacy Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-guard:
    name: Build, Unit Tests & OSS Anti-Leak Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build production PWA bundle
        run: npm run build

      - name: Run Node unit tests
        run: npm test

      - name: Run OSS privacy & integrity guard
        run: npm run test:guard
